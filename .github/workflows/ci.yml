name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version: '1.25.x', cache: true}
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/n0ding-dispatch
      - run: mkdir -p bin && go build -trimpath -o bin/n0ding-dispatch ./cmd/n0ding-dispatch && sh scripts/package-smoke.sh
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: {context: ., push: false, load: true, tags: 'n0ding-dispatch:ci'}
      - run: sh -n scripts/container-layout-smoke.sh && sh scripts/container-layout-smoke.sh n0ding-dispatch:ci
